name: Validar P0 de dosis e historial
on:
  pull_request:
    paths:
      - 'lib/modules/doses/presentation/personal_dose_screen.dart'
      - 'lib/modules/doses/presentation/dose_label_scanner_screen.dart'
      - 'test/personal_dose_ocr_safety_test.dart'
      - 'supabase/migrations/*preserve_member_history.sql'
      - 'supabase/tests/*member_history*'
      - 'supabase/tests/run_permission_clinic_operations.sh'
      - '.github/workflows/audit-p0-module-contract.yml'
      - 'scripts/supabase/test_module_contract*.py'
      - '.github/workflows/validate-p0-clinical-history.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  history-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts/supabase -p 'test_module_contract*.py'
      - run: bash supabase/tests/run_member_history_preservation.sh
  ocr-flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --no-pub test/personal_dose_ocr_safety_test.dart test/dose_label_scanner_test.dart test/dose_test.dart
