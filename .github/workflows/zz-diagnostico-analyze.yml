name: Diagnostico temporal de flutter analyze
# Temporal: publica la salida de `flutter analyze` y de `flutter test` como
# anotaciones, que si se pueden leer por API. Se borra al quedar todo verde.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/zz-diagnostico-analyze.yml'
      - 'lib/**'
      - 'test/**'
permissions:
  contents: read
jobs:
  diagnostico:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Analizar y probar, publicando los fallos como anotaciones
        run: |
          set +e
          flutter analyze > analyze.txt 2>&1
          echo "flutter analyze termino con: $?"
          flutter test --timeout 5m --concurrency 2 --reporter expanded > pruebas.txt 2>&1
          echo "flutter test termino con: $?"
          tail -40 pruebas.txt
          python3 - <<'PY'
          import re

          def anota(titulo, lineas, limite=6):
              bloques = [lineas[i:i + 20] for i in range(0, len(lineas), 20)][:limite]
              for n, bloque in enumerate(bloques, 1):
                  cuerpo = '%0A'.join(
                      x.replace('%', '%25').replace('\r', '')[:900] for x in bloque
                  )
                  print(f'::error title={titulo} {n}/{len(bloques)}::{cuerpo}')

          analisis = open('analyze.txt', encoding='utf-8', errors='replace').read().splitlines()
          hallazgos = [l.strip() for l in analisis if '•' in l]
          print(f'HALLAZGOS DE ANALYZE: {len(hallazgos)}')
          if hallazgos:
              anota('analyze', hallazgos, 2)

          pruebas = open('pruebas.txt', encoding='utf-8', errors='replace').read().splitlines()
          marcas = ('[E]', '\u274c')
          fallos = []
          for i, l in enumerate(pruebas):
              if any(x in l for x in marcas):
                  fallos.append('--- ' + l.strip()[:300])
                  for sig in pruebas[i + 1:i + 10]:
                      if any(x in sig for x in marcas) or '\u2705' in sig:
                          break
                      if sig.strip():
                          fallos.append('    ' + sig.strip()[:300])
          print(f'LINEAS DE FALLO DE PRUEBAS: {len(fallos)}')
          if fallos:
              anota('pruebas', fallos, 6)
          else:
              anota('cola de pruebas', [l.strip() for l in pruebas if l.strip()][-20:], 1)
          PY
