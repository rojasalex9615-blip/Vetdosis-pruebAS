name: Validar consentimiento y privacidad de ficha del personal
on:
  pull_request:
    paths:
      - 'supabase/migrations/*staff_medical_consent_access.sql'
      - 'supabase/tests/**'
      - 'supabase/proposed/**'
      - 'supabase/adaptations/**'
      - '.github/workflows/test-staff-medical-privacy.yml'
concurrency:
  group: staff-medical-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  staff-medical-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash supabase/tests/run_staff_medical_privacy.sh
