name: Aplica 12D en Pruebas
on:
  push:
    branches: [feature/legal-links-20261122]
    paths: ['.github/workflows/aplica-12d-pruebas.yml']
permissions:
  contents: write
jobs:
  aplica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/legal-links-20261122
      - name: Aplica la migración y comprueba el RPC
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.request
          project = 'wtrelwtztkddfktrfdpb'
          endpoint = f'https://api.supabase.com/v1/projects/{project}/database/query'
          token = os.environ.get('SUPABASE_ACCESS_TOKEN', '').strip()
          if not token:
              raise SystemExit('Falta el secreto SUPABASE_ACCESS_TOKEN')
          def query(sql):
              req = urllib.request.Request(
                  endpoint,
                  data=json.dumps({'query': sql}).encode(),
                  headers={'Authorization': f'Bearer {token}', 'Content-Type': 'application/json'},
                  method='POST')
              with urllib.request.urlopen(req, timeout=120) as r:
                  return json.load(r)
          sql = open('supabase/proposed/12D_registration_legal_preview.sql', encoding='utf-8').read()
          query(sql)
          print('migracion aplicada')
          check = query("""
            select to_regprocedure('public.beta_registration_legal()') is not null as existe,
                   has_function_privilege('anon','public.beta_registration_legal()','execute') as anon_puede,
                   (select count(*) from private.beta_terms where published) as terminos_publicados,
                   (select count(*) from private.beta_privacy_notices where published) as avisos_publicados,
                   jsonb_typeof(public.beta_registration_legal()) as tipo
          """)[0]
          print('verificacion:', json.dumps(check, ensure_ascii=False))
          par = query('select public.beta_registration_legal() as par')[0].get('par') or {}
          for k in ('terms', 'privacy'):
              v = par.get(k) or {}
              print(k, 'version=', v.get('version'), 'hash=', (v.get('hash') or '')[:12], 'largo=', len(v.get('content') or ''))
          if not check.get('existe') or not check.get('anon_puede'):
              raise SystemExit('La funcion no quedo disponible para anon')
          PY
      - name: Retira este workflow
        run: |
          set -euo pipefail
          git rm -q .github/workflows/aplica-12d-pruebas.yml
          git config user.name "VetDosis"
          git config user.email "noreply@vetdosis.local"
          git commit -m "Retira el workflow temporal de aplicacion de 12D"
          git push origin HEAD:feature/legal-links-20261122
