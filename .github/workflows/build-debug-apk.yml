name: Compilar APK de depuración
on:
  workflow_dispatch:
    inputs:
      publishable_key:
        description: Clave publicable del proyecto Supabase de pruebas
        required: true
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Verificar que el árbol compilado trae la marca y el icono
        shell: bash
        run: |
          set -euo pipefail
          echo "Compilando $GITHUB_REF_NAME en $GITHUB_SHA"
          missing=0
          for path in \
            lib/core/widgets/brand_mark.dart \
            lib/core/widgets/google_mark.dart \
            android/app/src/main/res/drawable/vetdosis_app_icon.xml \
            android/app/src/main/res/mipmap-anydpi-v26/vetdosis_launcher.xml \
            android/app/src/main/res/mipmap-anydpi/vetdosis_launcher.xml; do
            if [[ ! -f "$path" ]]; then
              echo "::error::Falta $path. Esta rama es anterior a la marca de la app; compila desde main."
              missing=1
            fi
          done
          if ! grep -q 'android:icon="@mipmap/vetdosis_launcher"' android/app/src/main/AndroidManifest.xml; then
            echo "::error::AndroidManifest.xml no usa el icono de VetDosis (@mipmap/vetdosis_launcher)."
            missing=1
          fi
          exit "$missing"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
          channel: stable
          cache: true
      - name: Preparar configuración del proyecto de pruebas
        env:
          SUPABASE_TEST_PUBLISHABLE_KEY: ${{ inputs.publishable_key }}
        run: |
          python3 - <<'PY'
          import json, os, urllib.error, urllib.request
          from pathlib import Path
          url = 'https://wtrelwtztkddfktrfdpb.supabase.co'
          key = os.environ['SUPABASE_TEST_PUBLISHABLE_KEY'].strip()
          if not key.startswith('sb_publishable_'):
              raise SystemExit('Se requiere una clave publicable de Supabase.')
          request = urllib.request.Request(url + '/auth/v1/settings', headers={'apikey': key})
          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  json.load(response)
          except urllib.error.HTTPError as error:
              raise SystemExit(
                  'El servidor rechazo la clave publicable (HTTP %d). '
                  'Copia la clave sb_publishable_ vigente del proyecto de pruebas '
                  'en Supabase: Settings > API Keys.' % error.code
              )
          Path('supabase/config.test.local.json').write_text(json.dumps({
              'SUPABASE_URL': url,
              'SUPABASE_PUBLISHABLE_KEY': key,
              'SUPABASE_EXISTING_SCHEMA': True,
              'SUPABASE_GOOGLE_ENABLED': False,
          }))
          PY
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test --timeout 5m
      - name: Generar APK instalable de depuración
        run: |
          flutter build apk --debug \
            --flavor beta \
            --target-platform android-arm64 \
            --dart-define=APP_CHANNEL=beta \
            --dart-define=BUILD_SHA="${GITHUB_SHA:0:7}" \
            --dart-define-from-file=supabase/config.test.local.json
      - uses: actions/upload-artifact@v4
        with:
          name: vetdosis-pruebas-debug-arm64
          path: build/app/outputs/flutter-apk/app-beta-debug.apk
          if-no-files-found: error
          retention-days: 14
