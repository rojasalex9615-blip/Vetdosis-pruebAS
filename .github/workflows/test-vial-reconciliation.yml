name: Validar reintentos de conciliacion de frascos
on:
  pull_request:
    paths:
      - 'supabase/migrations/*vial_reconciliation_retries.sql'
      - 'supabase/tests/*vial_reconciliation*'
      - 'supabase/tests/run_permission_medication.sh'
      - 'lib/modules/prescribing/**'
      - 'test/vial_reconciliation_test.dart'
      - '.github/workflows/test-vial-reconciliation.yml'
permissions:
  contents: read
jobs:
  vial-sql:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: bash supabase/tests/run_vial_reconciliation_retries.sh
